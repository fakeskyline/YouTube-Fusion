name: Build YouTube Fusion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK and AAB
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Download current official NPatch CLI JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/npatch
          gh release download --repo 7723mod/NPatch --pattern 'jar-*-release.jar' --dir build/npatch

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Fusion-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            build/npatch/*.jar
          if-no-files-found: error
          retention-days: 14
