name: Build YouTube Fusion APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download base YouTube APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base --repo "${GITHUB_REPOSITORY}" --pattern '*.apk' --dir input
          ls -lh input

      - name: Download Morphe Desktop CLI and patch bundle
        run: |
          mkdir -p tools patches
          curl -fL https://github.com/MorpheApp/morphe-desktop/releases/download/v2.3.0/morphe-desktop-2.3.0-all.jar -o tools/morphe.jar
          curl -fL https://github.com/MorpheApp/morphe-patches/releases/download/v2.3.0/patches-2.3.0.mpp -o patches/patches.mpp
          ls -lh tools/morphe.jar patches/patches.mpp

      - name: Inspect available YouTube patches
        run: |
          java -jar tools/morphe.jar list-patches --patches patches/patches.mpp --filter-package-name com.google.android.youtube --with-versions --with-options > patch-list.txt
          cat patch-list.txt

      - name: Patch YouTube with ad blocking
        run: |
          APK="$(find input -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          java -jar tools/morphe.jar patch --patches patches/patches.mpp --enable "Hide ads" --enable "Custom branding" --options customName="YouTube Fusion" --out output/YouTube-Fusion.apk "$APK"

      - name: Upload diagnostic and APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Fusion-build-${{ github.run_number }}
          path: |
            output/*.apk
            patch-list.txt
          if-no-files-found: warn
          retention-days: 14
